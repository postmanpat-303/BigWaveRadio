name: 🐞 Bug report
description: Something doesn't work (crash, no sound, install problem, wrong icon, ...)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! The macOS and Linux builds are brand new and haven't been tested on real machines yet, so every report helps.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Ubuntu / Debian / Mint
        - Fedora
        - Arch / CachyOS / Manjaro / EndeavourOS
        - Other Linux
        - Other
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS version and desktop
      description: e.g. "macOS 15.1", "Ubuntu 24.04, GNOME, Wayland", "CachyOS, KDE Plasma 6"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Windows setup (.exe)
        - Windows portable (.zip)
        - macOS .dmg
        - macOS .zip
        - .deb
        - .rpm
        - Arch package (.pkg.tar.zst / PKGBUILD)
        - AppImage
        - tar.gz
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BigWave Radio version
      description: Shown on the About page, e.g. 0.9.7
      placeholder: "0.9.7"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Paste any error message or terminal output.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open BigWave Radio
        2. Click ...
        3. ...
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag and drop a screenshot or screen recording here, if it helps.
