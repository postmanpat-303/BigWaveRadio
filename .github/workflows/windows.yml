name: Windows

# Windows x64 release built with Microsoft's toolchain (MSVC, static CRT):
# BigWaveRadio-<ver>-windows-x64.zip (portable), BigWaveRadio-<ver>-setup-x64.exe
# (NSIS, installer/bigwave.nsi) and SHA256SUMS-windows.txt.
# The exe must not need libunwind.dll, vcruntime or any other non-system DLL;
# the job fails if it does. Artifacts only: this workflow never touches a
# GitHub release (assets are published by hand after review).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (must equal [workspace.package] version in Cargo.toml); empty = Cargo version"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  RUSTFLAGS: -C target-feature=+crt-static
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Version
        id: ver
        env:
          INPUT_VER: ${{ inputs.version }}
        run: |
          VER=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="bwr-app"))')
          if [ -n "$INPUT_VER" ] && [ "${INPUT_VER#v}" != "$VER" ]; then
            echo "::error::requested version $INPUT_VER but Cargo.toml says $VER"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$VER" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo version $VER"; exit 1
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "BigWave Radio $VER"

      - name: NSIS
        run: |
          if ! command -v makensis >/dev/null && [ ! -x "/c/Program Files (x86)/NSIS/makensis.exe" ]; then
            # community.chocolatey.org sometimes times out (504): retry
            for i in 1 2 3 4 5; do
              choco install nsis -y --no-progress && break
              echo "choco failed (attempt $i), retrying in 30 s"; sleep 30
            done
          fi
          ls "/c/Program Files (x86)/NSIS/makensis.exe"

      - name: Tests
        run: cargo test --workspace --locked --release --target x86_64-pc-windows-msvc

      - name: Build and package (exe, zip, setup)
        run: scripts/package-windows.sh "${{ steps.ver.outputs.ver }}"

      - name: Verify DLL dependencies (no libunwind, no vcruntime)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $out = & $dumpbin.FullName /nologo /dependents dist\pkg\BigWaveRadio.exe
          $out
          $dlls = $out | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          "Dependencies: $($dlls -join ', ')" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $bad = @()
          foreach ($d in $dlls) {
            if ($d -match '(?i)libunwind|vcruntime|msvcp|ucrtbase|^api-ms-win-crt-|libgcc|libstdc\+\+|libwinpthread|^libc\+\+') { $bad += "$d (runtime DLL)"; continue }
            if ($d -match '(?i)^(api|ext)-ms-win-') { continue }
            if (-not (Test-Path "$env:SystemRoot\System32\$d")) { $bad += "$d (not in System32)" }
          }
          $raw = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes((Resolve-Path dist\pkg\BigWaveRadio.exe)))
          if ($raw -match '(?i)libunwind\.dll') { $bad += "libunwind.dll referenced in exe" }
          if ($bad.Count) { $bad | ForEach-Object { "::error::non-system dependency: $_" }; exit 1 }
          "OK: only Windows system DLLs"

      - name: Verify manifest, icon and version resources
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\pkg\BigWaveRadio.exe).Path
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName | Select-Object -Last 1
          & $mt.FullName -nologo "-inputresource:$exe;#1" "-out:$env:RUNNER_TEMP\extracted.manifest"
          if ($LASTEXITCODE) { "::error::no RT_MANIFEST resource #1"; exit 1 }
          $m = Get-Content -Raw "$env:RUNNER_TEMP\extracted.manifest"
          $m
          foreach ($want in 'level="asInvoker"', 'PerMonitorV2', 'Microsoft.Windows.Common-Controls', '{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}') {
            if (-not $m.Contains($want)) { "::error::manifest is missing $want"; exit 1 }
          }
          $v = (Get-Item $exe).VersionInfo
          $v | Format-List CompanyName, ProductName, FileDescription, ProductVersion, FileVersion, OriginalFilename
          if ($v.CompanyName -ne 'Del (postmanpat)' -or $v.ProductName -ne 'BigWave Radio' -or $v.ProductVersion -ne '${{ steps.ver.outputs.ver }}') { "::error::version info wrong"; exit 1 }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          $bmp = $icon.ToBitmap(); $bmp.Save("$env:RUNNER_TEMP\exe-icon.png")
          "icon: $($icon.Width)x$($icon.Height)"
          # The wolf icon (not the generic exe icon): RT_GROUP_ICON present in the resource table
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -Last 1
          $hdr = & $dumpbin.FullName /nologo /headers $exe
          ($hdr | Select-String 'subsystem|Resource Directory') | ForEach-Object { $_.Line }
          "Manifest + version info OK" | Out-File -Append $env:GITHUB_STEP_SUMMARY

      - name: Verify the embedded icon is the wolf (assets/bigwave.ico), BMP frames under 256 px
        run: |
          python -m pip install --quiet pefile
          # Frames under 256 px must be 32-bit BMP: Explorer/Edge often cannot
          # draw small PNG frames and show the generic exe/installer icon.
          python scripts/check_icons.py assets/bigwave.ico --exe dist/pkg/BigWaveRadio.exe --match \
            --setup "dist/BigWaveRadio-${{ steps.ver.outputs.ver }}-setup-x64.exe"

      - name: Smoke test (--version, --check-plugin on bundled plugins)
        run: |
          EXE=dist/pkg/BigWaveRadio.exe
          OUT=$("$EXE" --version)
          echo "$OUT"
          test "$OUT" = "BigWave Radio ${{ steps.ver.outputs.ver }}"
          for p in plugins/*/; do "$EXE" --check-plugin "$p"; done

      - name: Check zip contents
        run: |
          VER=${{ steps.ver.outputs.ver }}
          python - "dist/BigWaveRadio-$VER-windows-x64.zip" <<'PYEOF'
          import sys, zipfile
          names = sorted(zipfile.ZipFile(sys.argv[1]).namelist())
          print(names)
          assert names == sorted(["BigWaveRadio.exe", "README.txt", "LICENSE.txt", "THIRD_PARTY_LICENSES.txt"]), names
          PYEOF

      - name: Silent install / uninstall of the setup exe
        shell: pwsh
        run: |
          $setup = "dist\BigWaveRadio-${{ steps.ver.outputs.ver }}-setup-x64.exe"
          $p = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode) { "::error::setup exit $($p.ExitCode)"; exit 1 }
          $dir = "$env:ProgramFiles\BigWave Radio"
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path "$dir\BigWaveRadio.exe")) { "::error::exe not installed"; exit 1 }
          if (Test-Path "$dir\libunwind.dll") { "::error::libunwind.dll installed"; exit 1 }
          & "$dir\BigWaveRadio.exe" --version | Out-Host
          $u = Start-Process "$dir\Uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          Start-Sleep 5
          if (Test-Path "$dir\BigWaveRadio.exe") { "::error::uninstall left the exe"; exit 1 }
          "install/uninstall OK"

      - name: Headless launch (8 s, informational)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\bwrprofile"
          $p = Start-Process dist\pkg\BigWaveRadio.exe -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.log" -RedirectStandardError "$env:RUNNER_TEMP\err.log"
          Start-Sleep 8
          if ($p.HasExited) { "::warning::app exited after launch with code $($p.ExitCode) (runner may lack OpenGL)" } else { "still running after 8 s"; Stop-Process $p -Force }
          Get-Content "$env:RUNNER_TEMP\out.log", "$env:RUNNER_TEMP\err.log" -ErrorAction SilentlyContinue

      - name: SHA256
        run: |
          cat dist/SHA256SUMS-windows.txt
          { echo '```'; cat dist/SHA256SUMS-windows.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: BigWaveRadio-${{ steps.ver.outputs.ver }}-windows-x64-msvc
          path: |
            dist/BigWaveRadio-*-windows-x64.zip
            dist/BigWaveRadio-*-setup-x64.exe
            dist/SHA256SUMS-windows.txt
          if-no-files-found: error
