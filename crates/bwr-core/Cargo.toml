[package]
name = "bwr-core"
version.workspace = true
edition = "2021"
description = "BigWave Radio core: radio-browser.info client, models, library and settings"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"
