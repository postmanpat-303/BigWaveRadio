[package]
name = "bwr-plugins"
version.workspace = true
edition = "2021"
description = "BigWave Radio plugin host: Rhai scripts, permissions, hot reload, declarative drawing"

[dependencies]
bwr-spectrum = { path = "../bwr-spectrum" }
rhai = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
