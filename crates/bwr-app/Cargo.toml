[package]
name = "bwr-app"
version.workspace = true
edition = "2021"
description = "BigWave Radio — native Windows internet radio player (egui shell)"

[dependencies]
bwr-core = { path = "../bwr-core" }
bwr-player = { path = "../bwr-player" }
bwr-spectrum = { path = "../bwr-spectrum" }
bwr-plugins = { path = "../bwr-plugins" }
serde_json = "1"
eframe = "0.31"
egui = "0.31"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
# Native Windows APIs for global media keys and the notification-area icon.
# 0.58 is already in the dependency tree (via cpal), so this adds no new downloads.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Media",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Native file picker for the Plugins page "Import .zip" button.
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
