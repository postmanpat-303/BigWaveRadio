[quote]
q01 = "जीवन जो परखा न गया हो, वह जीने योग्य नहीं। — सुकरात"
q02 = "जो भटकते हैं, वे सब खोए नहीं होते। — जे.आर.आर. टॉल्किन"
q03 = "कठिनाई के बीच में ही अवसर छिपा होता है। — अल्बर्ट आइंस्टीन"
q04 = "जो भी हो, उसमें अच्छे बनो। — अब्राहम लिंकन"
q05 = "धीरे चलो, पर रुको मत। — कन्फ्यूशियस"
q06 = "भविष्यवाणी का सबसे अच्छा तरीका है उसे बना लेना। — एलन के"
q07 = "जिसे जीने का कारण मिल गया, वह हर तरीका सह सकता है। — फ्रेडरिक नीत्शे"
q08 = "सफल बनने की कोशिश न करो, मूल्यवान बनने की करो। — अल्बर्ट आइंस्टीन"
q09 = "सुख हमारे अपने हाथ में है। — अरस्तू"
q10 = "बड़े सपने देखो और असफल होने का साहस रखो। — नॉर्मन वॉन"
q11 = "अपने ज़ख़्मों को ज्ञान में बदलो। — ओप्रा विनफ्रे"
q12 = "अच्छी शुरुआत आधा काम है। — अरस्तू"
q13 = "सच्ची बुद्धि यही है कि हमें पता है कि हम कुछ नहीं जानते। — सुकरात"
q14 = "जीवन साहस के अनुपात में सिकुड़ता या फैलता है। — अनेस निन"
