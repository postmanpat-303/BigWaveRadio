# Beat Strobe — bundled with BigWave Radio.
id = "strobe"
name = "Beat Strobe"
version = "1.4.1"
api = 1
runtime = "rhai"
entry = "main.rhai"
author = "BigWave Radio"
description = "Strobe that randomly syncs to the beat, blacks out during breaks and flashes AI-uprising symbols. In-window or fullscreen."
permissions = ["audio", "overlay", "fullscreen", "hotkeys", "panel", "page"]
accent = "#e01030"     # card colour on the Plugins page

[[pages]]
id = "strobe"
title = "Strobe"
icon = "⚡"

[[hotkeys]]
keys = "Ctrl+F,U"     # hold Ctrl, press F, then U: start the strobe straight away
action = "start"

[settings]
rate    = { type = "float",  default = 12.0, min = 1.0, max = 12.0, label = "Starting speed (Hz, limited by the flash cap)" }
mode    = { type = "choice", default = "Fixed rate", options = ["Random beat", "Fixed rate"], label = "Mode" }
display = { type = "choice", default = "Fullscreen", options = ["Fullscreen", "In window"], label = "Display" }
symbols = { type = "bool",   default = true, label = "Show symbols" }
rings   = { type = "bool",   default = true, label = "Amiga interference rings (all modes)" }
sym_time = { type = "choice", default = "0.5 s", options = ["0.5 s", "1 s", "1.5 s", "2 s", "3 s", "Random 1.5-3 s"], label = "Symbol duration" }
fade     = { type = "choice", default = "Off", options = ["Off", "1 s", "3 s", "5 s", "10 s", "15 s"], label = "Fade to black (hold time)" }
on_time  = { type = "choice", default = "10 s", options = ["5 s", "10 s", "15 s", "20 s", "30 s", "60 s"], label = "Strobe on time between fades" }
color   = { type = "color",  default = "#ffffff", label = "Flash colour" }
